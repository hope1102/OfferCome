<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>OfferCome 通用网申回归页</title>
  <style>
    body { max-width: 850px; margin: 30px auto; font: 15px system-ui; color: #1b2820; }
    form { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    label { display: flex; flex-direction: column; gap: 5px; }
    input, select, textarea { padding: 8px; }
    fieldset { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    textarea, .wide { grid-column: 1 / -1; }
    #result { margin: 20px 0; padding: 12px; background: #eef5f0; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>OfferCome 脱敏测试表单</h1>
  <p>该页面不会提交任何数据，用于验证字段扫描、匹配、填充和事件触发。</p>
  <button id="run" type="button">运行回归验证</button>
  <div id="result">尚未运行</div>

  <form>
    <label for="candidate-name">姓名 *</label><input id="candidate-name" name="candidateName" required>
    <label>电子邮箱<input id="candidate-email" type="email" autocomplete="email"></label>
    <label>手机号码<input id="candidate-phone" type="tel" placeholder="请输入联系电话"></label>
    <label>性别<select id="candidate-gender"><option value="">请选择</option><option>男</option><option>女</option></select></label>
    <label class="wide">个人简介<textarea id="summary" name="summary"></textarea></label>
    <label>出生日期<input id="birth-date" type="date" aria-label="出生日期"></label>
    <label>只读姓名<input id="readonly-name" value="网站锁定值" readonly></label>
    <label>登录密码<input id="login-password" type="password"></label>
    <label>是否接受出差 <span><input type="radio" name="travel" value="yes">是 <input type="radio" name="travel" value="no">否</span></label>

    <fieldset>
      <legend>教育经历</legend>
      <label>学校名称<input name="school[]"></label>
      <label>专业<input name="major[]"></label>
      <label>入学日期<input type="month" name="eduStart[]"></label>
      <label>毕业日期<input type="month" name="eduEnd[]"></label>
      <label>学校名称<input name="school[]"></label>
      <label>专业<input name="major[]"></label>
      <label>入学日期<input type="month" name="eduStart[]"></label>
      <label>毕业日期<input type="month" name="eduEnd[]"></label>
      <label>学校名称<input name="school[]"></label>
      <label>专业<input name="major[]"></label>
      <label>入学日期<input type="month" name="eduStart[]"></label>
      <label>毕业日期<input type="month" name="eduEnd[]"></label>
    </fieldset>

    <fieldset>
      <legend>家庭成员</legend>
      <label>工作单位<input id="family-company" name="familyCompany"></label>
    </fieldset>

    <fieldset>
      <legend>实习/工作经历</legend>
      <label>实习/工作单位<input id="experience-company" name="experienceCompany" placeholder="请填写您的实习/工作所在单位名称"></label>
    </fieldset>

    <fieldset>
      <legend>学生会/社团活动</legend>
      <label>是否有担任学生干部经历<select id="campus-has"><option value="">请选择</option><option>是</option><option>否</option></select></label>
      <label>干部级别<select id="campus-level"><option value="">请选择</option><option>院学生会</option><option>班级</option><option>省级</option></select></label>
      <label>干部职级<select id="campus-position"><option value="">请选择</option><option>干事</option><option>部长</option></select></label>
      <label>开始时间<input id="campus-start" type="month" placeholder="请选择您开始担任学生干部的时间"></label>
      <label>结束时间<input id="campus-end" type="month" placeholder="请选择您担任学生干部的结束时间"></label>
      <label class="wide">工作描述<textarea id="campus-description" placeholder="请描述您在担任学生干部期间的主要职责、取得的工作成果或亮点"></textarea></label>
    </fieldset>

    <fieldset>
      <legend>论文/专利</legend>
      <label>类型<select id="publication-type"><option value="">请选择</option><option>论文</option><option>发明专利</option><option>软著</option></select></label>
      <label>论文/专利名称<input id="publication-title"></label>
      <label>发表/授权渠道<input id="publication-channel"></label>
      <label>作者顺序<select id="publication-author"><option value="">请选择</option><option>第一作者</option><option>共同第一作者</option><option>第二作者</option></select></label>
      <label>影响因子<input id="publication-if"></label>
      <label>专利号<input id="publication-patent"></label>
      <label>发表/授权时间<input id="publication-date" type="month"></label>
      <label>论文/专利链接<input id="publication-url" type="url"></label>
      <label class="wide">详情<textarea id="publication-details"></textarea></label>
    </fieldset>
  </form>

  <script src="../../src/shared/defaults.js"></script>
  <script src="../../src/shared/utils.js"></script>
  <script src="../../src/shared/fields.js"></script>
  <script src="../../src/content/site-adapters.js"></script>
  <script src="../../src/content/form-analyzer.js"></script>
  <script src="../../src/content/matcher.js"></script>
  <script src="../../src/content/filler.js"></script>
  <script>
    document.querySelectorAll("input,textarea,select").forEach((element) => {
      element.addEventListener("input", () => element.dataset.inputEvent = "yes");
      element.addEventListener("change", () => element.dataset.changeEvent = "yes");
    });
    document.getElementById("run").addEventListener("click", async () => {
      const OC = globalThis.OfferCome;
      const profile = OC.createDefaultProfile();
      Object.assign(profile.basics, {
        fullName: "测试用户", email: "test@example.com", phone: "13800000000", gender: "女",
        birthDate: "2000-06-15", summary: "这是一段脱敏的个人简介。"
      });
      profile.answers.acceptTravel = "是";
      profile.experience = [{ company: "正确的实习单位", description: "不应填入的实习工作描述" }];
      profile.family = [{ company: "正确的家属单位" }];
      profile.awards = [{ level: "不应填入的奖项级别" }];
      profile.campus = [{
        hasCadreExperience: "是", cadreLevel: "院学生会", cadrePosition: "干事",
        startDate: "2020-12-01", endDate: "2022-03-01", description: "正确的学生干部工作描述"
      }];
      profile.publications = [{
        type: "论文", title: "组合导航算法研究", channel: "示例期刊", authorOrder: "第一作者",
        impactFactor: "8.9", patentNumber: "", date: "2026-06", url: "https://example.com/paper", details: "脱敏论文摘要"
      }];
      profile.education = [
        { school: "示例大学", major: "计算机科学", startDate: "2022-09", endDate: "2025-06" },
        { school: "示例学院", major: "软件工程", startDate: "2018-09", endDate: "2022-06" }
      ];
      const settings = { ...OC.createDefaultSettings(), minimumConfidence: 0.62, fillSensitiveFields: true };
      const analysis = OC.formAnalyzer.analyze();
      const pairs = OC.matcher.matchAll(analysis.controls, profile, settings);
      const results = await OC.filler.fillAll(pairs, settings);
      const values = {
        name: document.getElementById("candidate-name").value,
        email: document.getElementById("candidate-email").value,
        phone: document.getElementById("candidate-phone").value,
        gender: document.getElementById("candidate-gender").value,
        birthDate: document.getElementById("birth-date").value,
        schools: Array.from(document.querySelectorAll("[name='school[]']")).map((el) => el.value),
        majors: Array.from(document.querySelectorAll("[name='major[]']")).map((el) => el.value),
        eduStarts: Array.from(document.querySelectorAll("[name='eduStart[]']")).map((el) => el.value),
        eduEnds: Array.from(document.querySelectorAll("[name='eduEnd[]']")).map((el) => el.value),
        travelYes: document.querySelector("[name='travel'][value='yes']").checked,
        travelNo: document.querySelector("[name='travel'][value='no']").checked,
        familyCompany: document.getElementById("family-company").value,
        experienceCompany: document.getElementById("experience-company").value,
        campusHas: document.getElementById("campus-has").value,
        campusLevel: document.getElementById("campus-level").value,
        campusPosition: document.getElementById("campus-position").value,
        campusStart: document.getElementById("campus-start").value,
        campusEnd: document.getElementById("campus-end").value,
        campusDescription: document.getElementById("campus-description").value,
        publicationType: document.getElementById("publication-type").value,
        publicationTitle: document.getElementById("publication-title").value,
        publicationChannel: document.getElementById("publication-channel").value,
        publicationAuthor: document.getElementById("publication-author").value,
        publicationIf: document.getElementById("publication-if").value,
        publicationPatent: document.getElementById("publication-patent").value,
        publicationDate: document.getElementById("publication-date").value,
        publicationUrl: document.getElementById("publication-url").value,
        publicationDetails: document.getElementById("publication-details").value,
        readonlyName: document.getElementById("readonly-name").value,
        password: document.getElementById("login-password").value,
        inputEvent: document.getElementById("candidate-name").dataset.inputEvent,
        changeEvent: document.getElementById("candidate-name").dataset.changeEvent
      };
      const passed = values.name === "测试用户" && values.email === "test@example.com" &&
        values.phone === "13800000000" && values.gender === "女" && values.birthDate === "2000-06-15" &&
        values.schools.join("|") === "示例大学|示例学院|" && values.majors.join("|") === "计算机科学|软件工程|" &&
        values.eduStarts.join("|") === "2022-09|2018-09|" && values.eduEnds.join("|") === "2025-06|2022-06|" &&
        values.travelYes && !values.travelNo && values.familyCompany === "正确的家属单位" &&
        values.experienceCompany === "正确的实习单位" &&
        values.campusHas === "是" && values.campusLevel === "院学生会" && values.campusPosition === "干事" &&
        values.campusStart === "2020-12" && values.campusEnd === "2022-03" &&
        values.campusDescription === "正确的学生干部工作描述" && values.readonlyName === "网站锁定值" && values.password === "" &&
        values.publicationType === "论文" && values.publicationTitle === "组合导航算法研究" &&
        values.publicationChannel === "示例期刊" && values.publicationAuthor === "第一作者" &&
        values.publicationIf === "8.9" && values.publicationPatent === "" && values.publicationDate === "2026-06" &&
        values.publicationUrl === "https://example.com/paper" && values.publicationDetails === "脱敏论文摘要" &&
        values.inputEvent === "yes" && values.changeEvent === "yes";
      document.getElementById("result").textContent = `${passed ? "PASS" : "FAIL"}\n${JSON.stringify({ controls: analysis.controls.length, matched: pairs.filter(p => p.match).length, results: results.map(r => r.status), values }, null, 2)}`;
      document.body.dataset.testResult = passed ? "pass" : "fail";
    });
  </script>
</body>
</html>
